services:
  - type: web
    name: crm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_LOGIN
        value: "true"
      - key: DEMO_ROLE
        value: "admin"
